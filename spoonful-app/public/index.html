<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9C4407">
<title>Spoonful: find any recipe</title>
<meta name="description" content="Search any dish or ingredient and get the full ingredient list and step-by-step method. Save recipes to your bookmarks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%98%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <button class="brand" type="button" data-action="home" aria-label="Spoonful home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-35 12 12)"><ellipse cx="12" cy="7" rx="3.6" ry="4.8"/><path d="M12 11.8V21"/></g></svg>
        </span>
        Spoonful
      </button>
      <nav class="tabs-d" aria-label="Primary">
        <button type="button" data-tab="search" data-action="tab-search">Search</button>
        <button type="button" data-tab="saved" data-action="tab-saved">Bookmarks <span class="count" data-count hidden>0</span></button>
      </nav>
    </div>
    <form id="searchForm" class="searchform" role="search" autocomplete="off">
      <label class="sr-only" for="q">Search for a recipe</label>
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" name="q" placeholder="Search a dish or ingredient" enterkeyhint="search" maxlength="120">
        <button class="btn-go" type="submit">Find recipe</button>
      </div>
    </form>
  </div>
</header>

<div class="wrap" id="filtersWrap">
  <div class="filters" id="filters" role="group" aria-label="Recipe preferences"></div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <section id="home" aria-label="Home"></section>

  <section id="results" aria-label="Recipe" hidden>
    <div id="recipeMount"></div>
    <section id="moreMount" aria-label="More ideas"></section>
    <p class="foot">Recipes are generated by AI and can contain mistakes. Always check ingredients for allergens and cook meat, poultry and fish to safe temperatures.</p>
  </section>

  <section id="saved" aria-label="Bookmarks" hidden>
    <div class="sec-head"><h1>Bookmarks</h1><span id="savedCount" class="muted"></span></div>
    <input id="savedFilter" class="sfilter" type="search" placeholder="Filter your bookmarks" aria-label="Filter your bookmarks" hidden>
    <div id="savedMount"></div>
  </section>
</main>

<nav class="bnav" aria-label="Primary">
  <button type="button" data-tab="search" data-action="tab-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search
  </button>
  <button type="button" data-tab="saved" data-action="tab-saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    Bookmarks
    <span class="count" data-count hidden>0</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script src="/app.js" defer></script>
</body>
</html>
